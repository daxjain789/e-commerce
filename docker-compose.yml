services:
  store:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/store.db
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - store-data:/app/data
      - store-uploads:/app/public/uploads

volumes:
  store-data:
  store-uploads:
